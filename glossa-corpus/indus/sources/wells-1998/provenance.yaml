notes: >
  INTAKE-PINNED 2026-10-25 (holdings sweep copy; verification in this
  directory — see wells_1998_sign_list_extraction_2026-10-25.md for the
  full record). Identity confirmed from the thesis title page:
  "An Introduction To Indus Writing" by Bryan Wells, A Thesis submitted
  to the Faculty of Graduate Studies in partial fulfilment of the
  requirements for the degree of Master of Arts, Department of
  Archaeology, Calgary, Alberta, January 1998. File: 12,298,934 bytes;
  295 PDF pages; SHA-256 as above, re-verified at the start of the
  2026-10-25 extraction and matched exactly (this is the exhibited
  copy named in the trigger-census instrument, files/2026-10-25-
  trigger-census-instrument.md, Arm 1). The PDF is a UMI scan produced
  with Adobe Acrobat 6.02 Paper Capture (1999): it carries an embedded
  OCR text layer of low quality (character error is heavy in prose and
  the small table type of Appendix I is largely dropped), over
  page images that are legible throughout. Printed pagination: printed
  page = PDF page − 10, verified at PDF pp. 81 (printed 71), 82 (72),
  87 (77), 126 (116), 132 (122), 146 (136).
  Structure: Chapters 1–5 (printed pp. 1–124); Bibliography (to printed
  ~134); Appendix I = Table 3.2 "Signs Sorted by Sign Number"
  (printed pp. 136–~285, PDF pp. 146–295) — Wells' sign list data
  base: 587 signs with 802 varieties (Chapter 3, printed p. 49).
  DESIGNATED USE: the Wells arm of the Spec 071 reopening-trigger
  census (an exhibited published list; see
  docs/decisions/2026-10-25-spec-071-retirement-decision.md) and the
  M7 witness census. CITATIONS.md §A.8a records this holding.
  Wells 2006 (PhD thesis, sibling holding) is a separate item and is
