  (original edition; © page: Tata Press, Bombay; price Rs. 250).
  File: 16,445,165 bytes; 843 PDF pages = 1 DLI cover sheet + 842 leaves;
  printed extent 825 pp. (printed page = PDF page − 12, verified at sampled
  folios 4, 6, 10, 32, 39, 417, 548, 717, 728 and at printed p. 825).
  IMAGE-ONLY scan: no text layer (842 of 843 pages carry zero extractable text);
  effective scan resolution ~150 dpi (min 140 / median 150 / max 176).
  Structure (contents, corroborated at sampled pages): Map printed p. 29;
  Codes p. 30; Sign List from p. 32; Texts pp. 163–416; Concordance pp. 417–716;
  Tables I–IX from p. 717; Appendices I–V from p. 785, Appendix V still running
  at printed p. 825. Completeness basis: page-count arithmetic + an image on
  every book leaf + sampled folio continuity — not a leaf-by-leaf collation.
  OCR behaviour at this resolution: Latin text and the numeric scaffolding
  (sign numbers, variant '+' markers, text numbers) are reference-grade;
  Indus sign glyphs are NOT OCR-recoverable and must be read visually.
  DESIGNATED USE: the Mahadevan arm of the Spec 071 reopening-trigger census
