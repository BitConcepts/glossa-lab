name: Deploy cloud edition (Spec 083)

# Production deploy for the Glossa Lab cloud edition (Spec 083 Step 1,
# T013). Manual (workflow_dispatch) or by pushing a `cloud-*` tag.
#
# There is exactly one target: production at glossa.bitconcepts.tech
# (Amendment 2 — production only, verified beforehand on the local
# production-shaped build and ephemeral preview deployments).
#
# FAIL CLOSED: until the `cloud-production` GitHub environment carries
# CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID (BitConcepts Cloudflare
# account), every run stops at the gate step with a clear message. The
# token must carry the Amendment 5 go-live gate-2 scopes (Workers and
# D1 deployment, DNS/Custom Domain configuration, Tunnel write, and
# Connectivity Directory Admin + Bind) — a narrower token fails the
# deploy steps themselves, by design. Further gates below refuse the
# run while the wrangler config still carries a placeholder D1
# database id or VPC service id. That inert-until-gated state is
# intended: the workflow ships ready, it does not ship live.
#
# Amendment 5 shape: the surviving legs are the edge deploy (Worker +
# Custom Domain + VPC binding) and the D1 migrations. There is no
# container image, no bundle publish leg, and no other origin.

on:
  workflow_dispatch:
  push:
    tags:
      - "cloud-*"

# One production deploy at a time; never cancel an in-flight deploy.
concurrency:
  group: deploy-cloud-production
  cancel-in-progress: false

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy edge to production
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: cloud-production

    steps:
      - name: Gate — Cloudflare secrets must exist
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=0
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not set in the cloud-production environment. The BitConcepts Cloudflare account gate is still pending — add the secret and re-run. Failing closed; nothing was deployed."
            missing=1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID is not set in the cloud-production environment. The BitConcepts Cloudflare account gate is still pending — add the secret and re-run. Failing closed; nothing was deployed."
            missing=1
          fi
          exit $missing

      - uses: actions/checkout@v7

      - name: Gate — real D1 database id must be filled in
        run: |
          if grep -A3 'binding = "DB"' cloud/edge/wrangler.toml | grep -q "00000000-0000-0000-0000-000000000000"; then
            echo "::error::cloud/edge/wrangler.toml still carries the placeholder D1 database_id. Create the database once (wrangler d1 create glossa-identity) and commit the returned id first — see cloud/edge/README.md, Deploy checklist. Failing closed; nothing was deployed."
            exit 1
          fi

      - name: Gate — real VPC service id must be filled in
        run: |
          if grep -A3 'binding = "GLOSSA_ORIGIN"' cloud/edge/wrangler.toml | grep -q "00000000-0000-0000-0000-000000000000"; then
            echo "::error::cloud/edge/wrangler.toml still carries the placeholder VPC service_id for GLOSSA_ORIGIN. Register the glossa-desktop-origin VPC Service (T053 checklist) and commit the returned id first. Failing closed; nothing was deployed."
            exit 1
          fi

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: cloud/edge/package-lock.json

      - name: Install edge dependencies
        working-directory: cloud/edge
        run: npm ci

      - name: Typecheck + unit tests
        working-directory: cloud/edge
        run: |
          npm run typecheck
          npm test

      # Schema first, then code: the new edge never runs against an
      # unmigrated identity store.
      - name: Apply D1 migrations (remote)
        working-directory: cloud/edge
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply glossa-identity --remote

      - name: Gate — edge service credential exists
        working-directory: cloud/edge
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if ! npx wrangler secret list | grep -q "SERVICE_CREDENTIAL"; then
            echo "::error::The SERVICE_CREDENTIAL Worker secret is not set. Set it once with: cd cloud/edge && npx wrangler secret put SERVICE_CREDENTIAL (value generated by the operator; never committed). Failing closed; nothing was deployed."
            exit 1
          fi

      # wrangler deploy ships the Worker with its Custom Domain route
      # and the GLOSSA_ORIGIN VPC binding (Amendment 5, T055). No
      # image is built and nothing else is published: the application
      # origin is the owner's desktop, reached through the tunnel.
      - name: Deploy (wrangler deploy — Worker + Custom Domain + VPC binding)
        working-directory: cloud/edge
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
