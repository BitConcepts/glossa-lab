notes: >
  REBUILD of the three contact-zone datasets confirmed lost by the holdings
  reconciliation of 2026-10-25 (RECORDED-NOT-HELD items #28-#30). These are
  NEW files with NEW provenance — not the lost originals. Full record:
  contact_zone_rebuild_provenance.md in this directory. Placement decision:
  the files live at the canonical loader paths (corpora/downloads/contact_zone/,
  a gitignored store — the loss mode that destroyed the originals) AND as
  tracked copies here, so the loss cannot silently repeat. laursen_2010_table1
  remains an open gap beyond the 5 recovered rows until a lawful copy of
  Laursen 2010 (closed access; DOI above) is in hand.
