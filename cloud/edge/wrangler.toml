# Glossa Lab cloud edge — Spec 083 (T012).
#
# PRODUCTION ONLY (Amendment 2, C083-14): exactly one deployment exists,
# at glossa.bitconcepts.tech. Verification runs against the local
# production-shaped build (cloud/docker-compose.yml) and ephemeral
# preview deployments (`wrangler deploy --name glossa-edge-preview-<suffix>`,
# torn down after the run). Do NOT add environment sections or extra
# routes that create another standing environment.

name = "glossa-edge"
main = "src/index.ts"
compatibility_date = "2025-10-01"

# The single production hostname.
[[routes]]
pattern = "glossa.bitconcepts.tech"
custom_domain = true

# D1 identity store (migrations in ./migrations, T010).
# Database `glossa-identity` was created 2026-11-05 (Spec 083 go-live
# sequence); migrations are applied by the deploy workflow before the
# Worker deploys (`wrangler d1 migrations apply glossa-identity
# --remote`). The deploy workflow refuses to run while a placeholder
# id stands here.
[[d1_databases]]
binding = "DB"
database_name = "glossa-identity"
database_id = "5de6e49e-bc67-4eaf-94da-728ae9b1d8a7"
migrations_dir = "migrations"

# The application origin (Amendment 5, T055): the owner's Spec 080
# production desktop install on TRISTEN-DESKTOP, reached through a
# Workers VPC Service bound here as GLOSSA_ORIGIN. The VPC Service
# `glossa-desktop-origin` fronts the named Cloudflare Tunnel
# `glossa-desktop` (host IPv4 127.0.0.1, HTTP port 8001); the tunnel
# publishes no hostname and no application route — this binding is the
# only path to it (C083-8, C083-14).
#
# service_id is the registered VPC Service `glossa-desktop-origin`,
# created 2026-11-06 under the T053 checklist
# (specs/083-cloud-edition/records/t053-tunnel-vpc-checklist.md, §2
# step 5) once the Tunnel/VPC configuration scopes landed. The tunnel
# `glossa-desktop` it fronts has id
# e06ace7e-68b6-4b88-b3cc-177bda09ab3e. The deploy workflow's
# placeholder refusal no longer applies to this value.
[[vpc_services]]
binding = "GLOSSA_ORIGIN"
service_id = "01a1b018-5464-7a50-8369-3cd42a2a5387"

# Secrets are NOT declared here. The edge-to-origin service credential
# is a Worker secret:
#   wrangler secret put SERVICE_CREDENTIAL
# (see README.md, "Deploy checklist"). No secret value ever appears in
# this file, in code, or in the repository. The desktop's copy of the
# same credential lives in the desktop install's protected credential
# storage (T056), provisioned at go-live; it is never committed either.

# Observability (enabled 2026-11-10 via the API; encoded here so a
# wrangler deploy does not clear it — the 2026-11-11 deploy did
# exactly that and it had to be re-enabled by hand).
[observability]
enabled = true
head_sampling_rate = 1.0
