extends: ''
name: glossa-lab
type: research-python  # specsmith detects this; project has FastAPI backend + React frontend
platforms:
- windows
- linux
- macos
language: python
spec_version: 0.13.0
aee_phase: release
description: Imported project (119 files detected)
services: false
shell_wrappers: false
exec_shims: true
git_init: false
vcs_platform: github
branching_strategy: gitflow
default_branch: main
develop_branch: develop
require_pr_reviews: true
required_approvals: 1
require_ci_pass: true
allow_force_push: false
use_remote_rules: false
verification_tools:
  backend: pytest
  frontend: playwright
detected_build_system: pyproject+vite
detected_frontend_framework: react
detected_test_framework: pytest+playwright
# The project IS backend-frontend (FastAPI + React/Vite). specsmith detects
# 'research-python' because of the research scripts directory. Suppress the
# false-positive type mismatch — verified false positive per governance rules.
suppress_checks:
  - scaffold_type_mismatch
ledger_line_threshold: 1000
integrations:
- agents-md
